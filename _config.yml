title: "MINWOO.LOG"
description: "배운 것과 만든 것을 오래 남기는 개발 블로그"
url: ""
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /posts/:title/
future: false
exclude:
  - README.md
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .omx
  - _templates

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
