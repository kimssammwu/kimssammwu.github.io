---
layout: default
---
<article class="article">
  <header class="article-header">
    <a class="back-link" href="{{ '/notes/' | relative_url }}">← 모든 기록</a>
    <p class="article-kicker">{{ page.category }}</p>
    <h1>{{ page.title }}</h1>
    <p class="article-description">{{ page.description }}</p>
    <div class="article-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y. %m. %d" }}</time>
      <span aria-hidden="true">·</span>
      <span>{{ page.read_time | default: 5 }}분 읽기</span>
    </div>
  </header>

  {% if page.image %}
  <figure class="article-cover">
    <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | escape }}" width="1440" height="900">
  </figure>
  {% endif %}

  <div class="article-grid"><div class="prose">{{ content }}</div></div>
</article>
