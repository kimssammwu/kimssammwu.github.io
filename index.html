---
layout: default
title:
body_class: landing-page
---
<section class="landing-hero" aria-labelledby="landing-title">
  <div class="landing-mark">
    <p class="landing-index">Archive / {% if site.posts.size < 10 %}0{% endif %}{{ site.posts.size }}</p>
    <h1 id="landing-title">MINWOO<span>.LOG</span></h1>
  </div>
  <div class="landing-notes">
    <a class="landing-notes-heading" href="{{ '/notes/' | relative_url }}"><span>Notes</span><span aria-hidden="true">↗</span></a>
    <ol>
      {% for post in site.posts limit: 3 %}
      <li>
        <a href="{{ post.url | relative_url }}">
          <span class="landing-note-number">0{{ forloop.index }}</span>
          <span>{{ post.title }}</span>
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y. %m. %d" }}</time>
        </a>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
